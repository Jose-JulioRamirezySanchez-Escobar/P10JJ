[project]
name = "p10jj"
version = "0.1.0"
description = "P10JJ — Generador de contenido con LLMs y RAG"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "JJ", email = "vscode01.jj@gmail.com" }]
keywords = ["llm", "rag", "langchain", "streamlit", "groq", "gemini"]

# Dependencias base — cubren Niveles Esencial y Medio.
dependencies = [
    "langchain>=0.3,<0.4",
    "langchain-groq>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-community>=0.3",
    "chromadb>=0.5,<0.6",
    "sentence-transformers>=3.0",
    "python-dotenv>=1.0",
    "streamlit>=1.37",
    "pydantic>=2.7",
    "tenacity>=8",
]

# Grupos opcionales — se instalan con: uv sync --group rag --group agents
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "nbval>=0.11",
    "ruff>=0.6",
    "ipdb",
    "pre-commit>=3.7",
]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "jupytext>=1.16",
    "ipywidgets>=8",
]
rag = [
    "pypdf>=4",
    "arxiv>=2.1",
    "tiktoken>=0.7",
    "unstructured>=0.15",
]
agents = [
    "langgraph>=0.2",
    "langsmith>=0.1",
    "crewai>=0.55",
]
finance = [
    "yfinance>=0.2",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p10jj"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: tests que llaman a APIs reales (Groq) y consumen cuota",
]
addopts = "--cov=p10jj --cov-report=term-missing"
